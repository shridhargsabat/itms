name: CI/CD
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  workflow_dispatch:

jobs:
  # ── Frontend: install + typecheck + production build ──────────────────
  frontend-check:
    runs-on: ubuntu-latest   # node:20-bullseye job container
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Frontend - Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend - Typecheck + build
        run: |
          cd frontend
          npm run build

  # ── Backend: Rust compile check ───────────────────────────────────────
  # node:20-bullseye has no Rust toolchain, so override the job container
  # with the Rust builder image (same base as the backend Dockerfile).
  backend-check:
    runs-on: ubuntu-latest
    container:
      image: rust:1.97-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend - Install build deps
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends \
            gcc libc6-dev pkg-config 2>&1 | tail -2

      - name: Backend - cargo check (release profile)
        run: |
          cd backend
          cargo check --release

  # ── Deploy: build+push registry images, compose up, smoke ─────────────
  # Runs on the VPS runner (docker socket + filesystem access). Only fires on
  # a real push to main (PRs only run the two check jobs above, not deploy).
  deploy:
    runs-on: vps-deploy
    needs: [frontend-check, backend-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy to live via Host Docker
        run: |
          echo "🚀 Deploying ITMS — build+push both images, compose up --pull always..."

          # Install Docker CLI (runner container is node:20-bullseye)
          apt-get update -qq && apt-get install -y -qq docker.io 2>&1 | tail -3

          # Helper container with host Docker + filesystem access + the
          # itms-deploy-bot registry token. Mount /root/itms as the deploy
          # checkout; the script resets it to origin/main and deploys.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /root/itms:/code \
            -v /root/.hermes/itms-deploy-bot-token.txt:/run/secrets/registry-token:ro \
            -w /code \
            docker:28-cli \
            sh -c '
              apk add --no-cache git openssh-client 2>/dev/null
              # Bootstrap: sync the host checkout BEFORE running the script —
              # the script itself re-syncs and self-heals, but must EXIST first.
              git -C /code fetch origin main 2>/dev/null
              git -C /code checkout -f main 2>/dev/null || git -C /code checkout -f FETCH_HEAD
              git -C /code reset --hard origin/main
              sh /code/scripts/build-deploy.sh
            ' 2>&1

          echo "✅ ITMS deploy complete!"

      - name: Backend freshness probe (non-blocking)
        # The deploy script already warns if the backend is stale; this is a
        # belt-and-braces re-check that surfaces the running image tag.
        run: |
          docker inspect itms-backend --format 'backend running image: {{.Config.Image}}' 2>/dev/null || echo "itms-backend not found"
          docker inspect itms-frontend --format 'frontend running image: {{.Config.Image}}' 2>/dev/null || echo "itms-frontend not found"
