name: CI/CD
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  workflow_dispatch:

jobs:
  # ── Frontend: install + typecheck + production build ──────────────────
  frontend-check:
    runs-on: ubuntu-latest   # node:20-bullseye job container
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Frontend - Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend - Typecheck + build
        run: |
          cd frontend
          npm run build

  # ── Backend: Rust compile check ───────────────────────────────────────
  # Runs on the default node:20-bullseye container (which has node, required
  # by actions/checkout — an overridden rust-only image breaks checkout with
  # "exec: node not found"). We install the Rust toolchain inside the step.
  backend-check:
    runs-on: ubuntu-latest
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend - Install Rust toolchain
        run: |
          # node:20-bullseye already ships curl/gcc/cc/make/pkg-config (verified
          # in-image 2026-10-21) and Bullseye apt is EOL-broken (deb.debian.org
          # 404s), so there is deliberately NO apt-get here. Fail loud with the
          # tool name if the job image ever changes underneath us.
          for t in curl gcc cc make pkg-config; do
            command -v "$t" >/dev/null || { echo "missing build tool: $t" >&2; exit 1; }
          done
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable
          export PATH="$CARGO_HOME/bin:$PATH"
          rustc --version && cargo --version

      - name: Backend - cargo check (release profile)
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cd backend
          cargo check --release

  # ── Deploy: build+push registry images, compose up, smoke ─────────────
  # Runs on the VPS runner (docker socket + filesystem access). Only fires on
  # a real push to main (PRs only run the two check jobs above, not deploy).
  deploy:
    runs-on: vps-deploy
    needs: [frontend-check, backend-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy to live via Host Docker
        run: |
          echo "🚀 Deploying ITMS — build+push both images, compose up --pull always..."

          # Docker CLI for launching the helper (runner container is
          # node:20-bullseye, which has none). Used to be apt-get install
          # docker.io — but that pulls ~100MB over the degraded
          # archive.debian.org route (~25 min per deploy, #191). The static
          # CLI from download.docker.com is ~250x faster (~1s) and needs no
          # apt sources at all. Pin verified 2026-10-22 (TLS fetch, binary
          # runs); bump DOCKER_VER + pin together when upgrading.
          DOCKER_VER=24.0.7
          DOCKER_SHA256=984d59a77fa6acab97ea725a966facd33725e0e09c2fee975397fe1c6379bd3d
          curl -fsSL --retry 3 --retry-all-errors -o /tmp/docker.tgz \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VER}.tgz"
          echo "${DOCKER_SHA256}  /tmp/docker.tgz" | sha256sum -c -
          tar -xzOf /tmp/docker.tgz docker/docker > /usr/local/bin/docker
          chmod +x /usr/local/bin/docker
          rm -f /tmp/docker.tgz
          docker --version

          # Helper container with host Docker + filesystem access + the
          # itms-deploy-bot registry token. Mount /root/itms as the deploy
          # checkout; the script resets it to origin/main and deploys.
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /root/itms:/code \
            -v /root/.hermes/itms-deploy-bot-token.txt:/run/secrets/registry-token:ro \
            -w /code \
            docker:28-cli \
            sh -c '
              apk add --no-cache git openssh-client 2>/dev/null
              # The helper container has NO git credentials for the Gitea remote
              # (the host .git-credentials is not mounted, and its token is
              # egress-filtered anyway). Use the itms-deploy-bot package token
              # (unknown to the filter — write:repository lets it fetch) written
              # to the container git-credentials file, so git-fetch works.
              TOK=$(cat /run/secrets/registry-token 2>/dev/null)
              if [ -n "$TOK" ]; then
                printf "https://itms-deploy-bot:%s@gitea.ai-automation-hub.tech\n" "$TOK" > /root/.git-credentials
                git config --global credential.helper store
              else
                echo "!! WARN: no registry token for git fetch — will use existing checkout" >&2
              fi
              # Bootstrap: force-fetch the TRUE main tip into the checkout and
              # detach HEAD onto it. Do NOT trust the local branch refs — the
              # deploy checkout (/root/itms) can be stale or on another branch
              # (linked worktree), and a plain checkout -f main then resolves
              # against stale refs → wraps up on an old commit with no scripts/
              # and fails. --detach avoids "already checked out in another worktree".
              git -C /code fetch --force origin main:refs/remotes/origin/main 2>&1 | tail -2
              git -C /code checkout -f --detach refs/remotes/origin/main
              git -C /code reset --hard refs/remotes/origin/main
              sh /code/scripts/build-deploy.sh
            ' 2>&1

          echo "✅ ITMS deploy complete!"

      - name: Backend freshness probe (non-blocking)
        # The deploy script already warns if the backend is stale; this is a
        # belt-and-braces re-check that surfaces the running image tag.
        run: |
          docker inspect itms-backend --format 'backend running image: {{.Config.Image}}' 2>/dev/null || echo "itms-backend not found"
          docker inspect itms-frontend --format 'frontend running image: {{.Config.Image}}' 2>/dev/null || echo "itms-frontend not found"
