<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- full-bleed background: maskable-safe (no transparent corners) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- network edges (hub → two leaves, leaf ↔ leaf) -->
  <g stroke="#818cf8" stroke-width="15" stroke-linecap="round" opacity="0.95">
    <line x1="256" y1="126" x2="172" y2="342"/>
    <line x1="256" y1="126" x2="340" y2="342"/>
    <line x1="172" y1="342" x2="340" y2="342"/>
  </g>
  <!-- leaf nodes -->
  <circle cx="172" cy="342" r="36" fill="#818cf8"/>
  <circle cx="340" cy="342" r="36" fill="#818cf8"/>
  <!-- hub node -->
  <circle cx="256" cy="126" r="40" fill="#a5b4fc"/>
  <!-- center router node -->
  <circle cx="256" cy="256" r="30" fill="#0f172a" stroke="#6366f1" stroke-width="9"/>
  <circle cx="256" cy="256" r="11" fill="#c7d2fe"/>
</svg>
