server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA: never cache the SW or manifest — browsers hold a stale SW up to 24h otherwise
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    default_type application/manifest+json;
    expires -1;
  }

  # PWA: hashed assets are content-addressed — immutable 1y
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    # SPA fallback: serve index.html for any non-file route (no $uri/ dir probe —
    # that 403s on client-side routes like /assets/ from a trailing slash)
    try_files $uri /index.html;
  }
}
