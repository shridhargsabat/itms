server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # #94: CSV imports can reach 10 MB — nginx default (1m) 413s them
  client_max_body_size 12m;

  # #89 security headers (H5): HSTS, frame denial, MIME sniffing, referrer,
  # permissions, CSP. Applied to the SPA and the /api proxy responses alike.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # #65/#90: camera allowed for same-origin only (QR scan audit page); the
  # rest stays blocked.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
  # React inline styles need 'unsafe-inline' for style-src; scripts are all
  # external hashed bundles ('self' only); SW is same-origin.
  # Wave 2-C: the theme pre-paint init is an external same-origin file
  # (/theme-init.js), so script-src stays 'self' with zero inline scripts —
  # any inline <script> (XSS probe or otherwise) is still blocked.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA: never cache the SW or manifest — browsers hold a stale SW up to 24h otherwise
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    default_type application/manifest+json;
    expires -1;
  }

  # PWA: hashed assets are content-addressed — immutable 1y
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    # SPA fallback: serve index.html for any non-file route (no $uri/ dir probe —
    # that 403s on client-side routes like /assets/ from a trailing slash)
    try_files $uri /index.html;
    # index.html is the app entry — never let a browser/proxy cache it, or it
    # pins an OLD hashed JS bundle and shows a stale layout (the double-scrollbar
    # "weird scrollbar" complaint from a cached pre-#140 bundle). Hashed /assets/
    # above stay immutable; only this entry document must always revalidate.
    add_header Cache-Control "no-cache";
  }
}
