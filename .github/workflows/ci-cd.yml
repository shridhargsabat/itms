name: CI/CD
on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  workflow_dispatch:

# GITHUB_TOKEN needs packages:write so the deploy job can push images to GHCR.
permissions:
  contents: read
  packages: write

# Supply-chain note: every `uses:` below is pinned to a full commit SHA (with
# the human-readable tag in a trailing comment) so a moved tag can never
# change what CI executes. Re-resolve with:
#   git ls-remote https://github.com/<owner>/<repo>.git 'refs/tags/<tag>'
# (for annotated tags use the peeled `^{}` commit SHA, not the tag object).

jobs:
  # ── Frontend: install + test + typecheck + production build ──────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22: matches frontend/Dockerfile (node:22-alpine) and local dev.
          # Node 20 breaks vitest workers (undici decompress `.bind` crash).
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend - Unit tests
        run: |
          cd frontend
          npx vitest run

      - name: Frontend - Typecheck + build
        run: |
          cd frontend
          npm run build

  # ── Backend: Rust compile check ──────────────────────────────────────────
  # GitHub's ubuntu-latest already ships a stable Rust toolchain, so unlike the
  # old Gitea job there is no rustup install step here.
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - name: Backend - cargo check (release profile)
        run: |
          cd backend
          cargo check --release

  # ── Frontend: npm audit (high/critical only) ─────────────────────────────
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - npm audit (high and above)
        run: |
          cd frontend
          npm audit --audit-level=high

  # ── Backend: dependency vulnerability audit ──────────────────────────────
  # Ignores live in backend/audit.toml (lockfile-only uncompiled crates, each
  # with justification + expiry). cargo-audit only discovers config at
  # ./.cargo/audit.toml, so the job stages the committed file there first.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Backend - cargo audit
        run: |
          cd backend
          mkdir -p .cargo
          cp audit.toml .cargo/audit.toml
          cargo audit

  # ── Backend: Rust unit tests (no DB required) ────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - name: Backend - cargo test
        run: |
          cd backend
          cargo test

  # ── Backend: clippy lints (warn-level only — warnings never fail) ───────
  # Deliberately NO `-D warnings`: the tree has pre-existing warnings and the
  # gate must stay green while they are paid down incrementally.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - name: Backend - cargo clippy (warnings allowed)
        run: |
          cd backend
          cargo clippy --all-targets

  # ── Deploy: SSH to the VPS, build+push GHCR images, compose up, smoke ────
  # Only fires on a real push to main (PRs run the two check jobs above, not
  # deploy). No self-hosted runner: the build runs on the VPS over SSH, exactly
  # like the old pipeline, but images go to GHCR instead of the Gitea registry.
  #
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   VPS_HOST      VPS public IP / hostname
  #   VPS_USER      SSH user (root)
  #   VPS_SSH_KEY   private deploy key whose public half is in /root/.ssh/authorized_keys
  #
  # NOTE: the first deploy creates PRIVATE ghcr.io packages. After it goes
  # green, flip both packages to public (package Settings → Change visibility)
  # so the VPS can pull on container restarts without credentials.
  deploy:
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Start SSH agent with deploy key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to live via SSH
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Deploying ITMS to $VPS_USER@$VPS_HOST ..."
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'EOF'
          set -eu
          # The deploy checkout lives at /root/itms with `origin` pointed at
          # GitHub; the script resets it to main, builds + pushes both images
          # to GHCR, recreates the stack, and smoke-tests it.
          cd /root/itms
          CODE_DIR=/root/itms REGISTRY=ghcr.io PUSH_USER=shridhargsabat \
            REGISTRY_TOKEN="$GHCR_TOKEN" sh scripts/build-deploy.sh
          EOF
          echo "✅ ITMS deploy complete!"

      - name: Backend freshness probe (non-blocking)
        # The deploy script already warns if the backend is stale; this is a
        # belt-and-braces re-check that surfaces the running image tags.
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "docker inspect itms-backend --format 'backend running image: {{.Config.Image}}' 2>/dev/null || echo 'itms-backend not found'; docker inspect itms-frontend --format 'frontend running image: {{.Config.Image}}' 2>/dev/null || echo 'itms-frontend not found'"
