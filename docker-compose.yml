services:
  db:
    image: postgres:18-alpine
    container_name: itms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: itms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: itms
      TZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    volumes:
      - itms_pgdata:/var/lib/postgresql   # PG18+: mount parent dir (pg_ctlcluster layout); /var/lib/postgresql/data is REJECTED by 18+ images
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itms -d itms"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [itms-net]
    # #90: drop all capabilities, no privilege escalation, read-only rootfs
    # (data dir is the volume; socket/tmp dirs are tmpfs as PG requires).
    # CAP_CHOWN + DAC_OVERRIDE + SETUID/SETGID + FOWNER are required by the
    # official image's entrypoint (chown data dir, traverse 0700 postgres dirs
    # as root, switch to the postgres user) — the minimal set; everything else
    # stays dropped.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, FOWNER]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 768M }

  backend:
    build: ./backend
    container_name: itms-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://itms:${POSTGRES_PASSWORD:?set in .env}@db:5432/itms
      INTAKE_TOKEN: ${INTAKE_TOKEN:-}
      TZ: Asia/Kolkata
    volumes:
      - itms_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      # #90: backend runs as uid 10001 — a fresh named volume is root-owned,
      # so chown it once before the app can write attachments.
      uploads-owner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [itms-net]
    # #90: runs as uid 10001 (Dockerfile USER); no caps, no rootfs writes
    # (uploads live on the volume; scratch files on /tmp tmpfs).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits: { cpus: "0.75", memory: 512M }

  frontend:
    build: ./frontend
    container_name: itms-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itms-net
      - dokploy-network
    # #90: nginx-unprivileged (uid 101) on 8080 — no caps needed (port > 1024);
    # cache/run/tmp dirs are tmpfs because the rootfs is read-only.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.itms-web.rule=Host(`itms.ai-automation-hub.tech`)
      - traefik.http.routers.itms-web.entrypoints=web
      - traefik.http.routers.itms-web.middlewares=redirect-to-https@file
      - traefik.http.routers.itms-websecure.rule=Host(`itms.ai-automation-hub.tech`)
      - traefik.http.routers.itms-websecure.entrypoints=websecure
      - traefik.http.routers.itms-websecure.tls=true
      - traefik.http.routers.itms-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.itms-websecure.service=itms
      - traefik.http.services.itms.loadbalancer.server.port=8080
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  uploads-owner:
    image: busybox:stable
    container_name: itms-uploads-owner
    command: ["sh", "-c", "chown -R 10001:10001 /app/uploads && echo uploads-owner-ok"]
    volumes:
      - itms_uploads:/app/uploads
    restart: "no"

volumes:
  itms_pgdata:
  itms_uploads:

networks:
  itms-net:
    driver: bridge
  dokploy-network:
    external: true